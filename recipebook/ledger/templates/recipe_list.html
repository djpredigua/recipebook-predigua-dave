{% extends 'base.html' %}

{% load static %}

{% block content %}

    <h1>{{ recipe.name }}</h1>
    <h2>
        <a href="{% url 'ledger:add_recipe' %}">Add New Recipe</a>
    </h2>
    <ul>
        {% for recipe in object_list %}
            <li>
                <a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a>
            </li>
        {% endfor %}
    </ul>

{% endblock %}
