{% extends 'base.html' %}

{% block content %}

    <h2>Create a New Recipe</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit Recipe</button>
    </form>

    <li>
        <a href="{% url 'ledger:recipe_list' %}">Back to Recipe List</a>
    </li>

{% endblock %}
