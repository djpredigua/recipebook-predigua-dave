{% extends 'base.html' %}

{% block content %}

    <h1>
        Add Image for {{ recipe.name }} 
    </h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>

    <li>
        <a href="{% url 'ledger:recipe_detail' pk=recipe.pk %}">Back to Recipe</a>
    </li>
    
{% endblock %}
